<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@config(orgName)</title>
<meta name="theme-color" content="#1C1A17">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>{{CSS}}</style>
<style>
  /* the product shell: one screen (the two-week schedule) and a sign-in */
  body.product-shibutz{ margin:0; min-height:100vh; }
  body.product-shibutz:has(.portal-shell[data-ptheme=dark]){ background:#1C1A17; color:#F3EEE4; }
  body.product-shibutz:has(.portal-shell[data-ptheme=light]){ background:#FAF7F2; color:#1d2433; }
  body.product-shibutz .view{ display:none; }
  body.product-shibutz .view.active{ display:block; }
  body.product-shibutz #tw-home-back{ display:none; }
  body.product-shibutz .portal-shell{ max-width:980px; margin:0 auto; padding:12px 14px 48px; box-sizing:border-box; }
  body.product-shibutz .portal-top{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  body.product-shibutz .portal-top .portal-title{ margin:0; flex:1 1 auto; }
  body.product-shibutz .sb-org{ flex:0 0 100%; }
  .sb-login{ max-width:420px; margin:8vh auto; padding:24px; }
  .sb-login h1{ margin:0 0 4px; font-size:26px; }
  .sb-login .sb-sub{ margin:0 0 20px; opacity:.75; }
  .sb-login label{ display:grid; gap:6px; margin:12px 0; font-weight:700; }
  .sb-login input{ min-height:48px; padding:8px 12px; border-radius:10px; border:1px solid var(--p-line, #777); background:var(--p-panel2, #2a2723); color:inherit; font:inherit; direction:ltr; text-align:left; }
  .sb-login .btn{ width:100%; min-height:50px; margin-top:10px; }
  .sb-login .sb-err{ min-height:24px; color:var(--p-no, #ff8a80); font-weight:700; margin-top:8px; }
  .sb-bar{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .sb-bar .sb-who{ opacity:.8; font-size:14px; }
  .sb-org{ font-size:13px; letter-spacing:.04em; opacity:.75; margin:6px 0 0; }
  .sb-login .sb-lang{ display:block; margin:18px auto 0; min-height:44px; padding:6px 16px; border:0; background:transparent; color:inherit; font:inherit; text-decoration:underline; cursor:pointer; }
  .sb-login .sb-or{ margin:18px 0 0; text-align:center; opacity:.75; }
  .sb-login .sb-row{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .sb-set{ display:grid; gap:14px; }
  .sb-set .sb-set-row{ display:grid; gap:6px; }
  .sb-set .sb-set-row > b{ font-size:15px; }
  .sb-set .mx-seg{ display:grid; grid-auto-flow:column; gap:6px; }
  .sb-set .mx-seg button{ min-height:48px; border-radius:10px; border:1px solid var(--color-border, #777); background:transparent; color:inherit; font:inherit; font-weight:700; cursor:pointer; }
  .sb-set .mx-seg button[aria-pressed=true]{ background:var(--gold); border-color:var(--gold); color:#1C1A17; }
  .sb-set .sb-help{ font-size:14px; opacity:.8; line-height:1.6; }
  .sb-login .sb-login-brand{ margin:0 0 10px; }
  .sb-login .install-link{ display:block; margin:14px auto 0; }
  body.product-shibutz #view-tw .mx-brand-small{ justify-content:flex-start; margin:0 0 6px; }
  body.product-shibutz #view-tw .install-link{ display:block; margin:22px auto 8px; min-height:44px; }
  /* the top in one line: logo + version, the organisation, settings (the review agents 2026-11-14) */
  body.product-shibutz #view-tw .sb-top{ display:flex; align-items:center; gap:10px; margin:0 0 4px; }
  body.product-shibutz #view-tw .sb-top .mx-brand-small{ margin:0; flex:none; }
  body.product-shibutz #view-tw .sb-top-org{ flex:1; min-width:0; font-weight:700; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* big text on a phone: the organisation's name on a line of its own, whole (the check of 2026-11-20: it was cut to "מר...") */
  @media (max-width:560px){ body.product-shibutz.portal-big #view-tw .sb-top{ flex-wrap:wrap; } body.product-shibutz.portal-big #view-tw .sb-top-org{ order:3; flex:1 1 100%; white-space:normal; } body.product-shibutz.portal-big #view-tw .sb-top #sb-theme{ margin-inline-start:auto; } }
  /* the settings folded under headings (Guy 21.11, as in the first site) */
  .sb-fold{ border:1px solid var(--p-line, rgba(127,127,127,.35)); border-radius:14px; overflow:hidden; }
  .sb-fold > summary{ display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:52px; padding:10px 14px; cursor:pointer; font-weight:800; font-size:16px; list-style:none; }
  .sb-fold > summary::-webkit-details-marker{ display:none; }
  .sb-fold > summary::after{ content:'▾'; opacity:.7; transition:transform .2s; }
  .sb-fold[open] > summary::after{ transform:rotate(180deg); }
  .sb-fold-body{ display:grid; gap:14px; padding:4px 14px 14px; }
  /* the light / dark switch in the top line (as the first site's) */
  body.product-shibutz #view-tw .sb-top .sb-look{ flex:none; width:44px; height:44px; border-radius:12px; border:1px solid var(--p-line, rgba(127,127,127,.35)); background:transparent; font-size:19px; cursor:pointer; line-height:1; padding:0; }
  /* the messages at the bottom: always light letters on a dark ground, in both looks (Guy 21.11: dark letters on dark blue in the light look) */
  body.product-shibutz .toast{ background:#24211d; color:#F7F2E8; border:1px solid rgba(247,242,232,.25); }
  body.product-shibutz .toast-undo-btn{ background:#F7F2E8; color:#1C1A17; }
  body.product-shibutz #view-tw .sb-hide-top{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  body.product-shibutz #view-tw .sb-org{ display:none; }
  .sb-login #sb-code{ direction:ltr; text-align:center; font-size:22px; letter-spacing:.2em; }
</style>
</head>
<body class="product-shibutz portal-mode">
<div id="protected-app">
  <section class="view" id="view-login"></section>
  <section class="view" id="view-apphome"></section>
  <section class="view" id="view-tw"></section>
</div>
<script>{{VENDOR_SUPABASE}}</script>
<script>{{JS}}</script>
</body>
</html>
